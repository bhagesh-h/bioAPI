[project]
name = "bioapi"
version = "0.0.1"
description = "A production-grade REST API for common bioinformatics workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "bhagesh-h" }]
keywords = ["bioinformatics", "fastapi", "fasta", "fastq", "vcf", "biopython"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ─── Ruff (lint + format; replaces black) ─────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
# The repository root is the import root: `app` and `tests` are both packages
# under it, so isort classifies them as first-party.
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",
]
ignore = [
    "B008",  # FastAPI relies on function calls (Depends/File/Query) in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Reading a fixture file with pathlib inside an async test blocks the loop for
# microseconds and keeps the tests readable; the rule matters in the app, not here.
"tests/*" = ["E501", "ASYNC230", "ASYNC240"]

[tool.ruff.format]
quote-style = "double"

# ─── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_decorators = false
# Biopython and pysam ship py.typed but leave most functions unannotated.
# Keep strict call checking for our own code and exempt only those two.
untyped_calls_exclude = ["Bio", "pysam"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["Bio.*", "pysam.*", "prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

# ─── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-q",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
markers = [
    "integration: exercises the full ASGI stack through httpx",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
